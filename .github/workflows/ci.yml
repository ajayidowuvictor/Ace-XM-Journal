name: CI

on:
  push:
    branches-ignore: [ci-logs]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# Fail a step when any command in a pipeline (such as `npm test | tee`) fails.
defaults:
  run:
    shell: bash

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Skip until the Expo project exists
        id: gate
        run: |
          if [ -f package-lock.json ]; then echo "ready=true" >> "$GITHUB_OUTPUT"; else echo "No package-lock.json yet; skipping checks."; fi
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm
      - name: Install
        if: steps.gate.outputs.ready == 'true'
        run: npm ci 2>&1 | tee -a /tmp/ci.log
      - name: Type check
        if: steps.gate.outputs.ready == 'true'
        run: npm run typecheck 2>&1 | tee -a /tmp/ci.log
      - name: Lint
        if: steps.gate.outputs.ready == 'true'
        run: npm run lint 2>&1 | tee -a /tmp/ci.log
      - name: Format check
        if: steps.gate.outputs.ready == 'true'
        run: npm run format:check 2>&1 | tee -a /tmp/ci.log
      - name: Tests
        if: steps.gate.outputs.ready == 'true'
        run: npm test -- --ci 2>&1 | tee -a /tmp/ci.log
      - name: Bundle check (Android JavaScript bundle builds)
        if: steps.gate.outputs.ready == 'true'
        run: npx expo export --platform android 2>&1 | tee -a /tmp/ci.log
      # Reported, not blocking yet: the starter's dev tooling has known advisories that still
      # need triage (see docs/STATUS.md). Switch to blocking once triaged.
      - name: Dependency audit (report)
        if: steps.gate.outputs.ready == 'true'
        continue-on-error: true
        run: npm audit --audit-level=high 2>&1 | tee -a /tmp/ci.log
      # Triage aid: which advisories reach the shipped app (runtime packages only) and a short
      # list of every affected package with its severity and whether a fix exists.
      - name: Dependency audit (runtime packages only, report)
        if: steps.gate.outputs.ready == 'true'
        continue-on-error: true
        run: |
          echo "=== AUDIT RUNTIME ONLY ===" | tee -a /tmp/ci.log
          npm audit --omit=dev --audit-level=high 2>&1 | tee -a /tmp/ci.log
      - name: Dependency audit (summary list)
        if: steps.gate.outputs.ready == 'true'
        continue-on-error: true
        run: |
          echo "=== AUDIT SUMMARY ===" | tee -a /tmp/ci.log
          npm audit --json 2>/dev/null | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{const v=JSON.parse(d).vulnerabilities||{};for(const [n,x] of Object.entries(v)){for(const w of x.via){if(typeof w==='object')console.log('ROOT | '+n+' | '+w.severity+' | '+w.title+' | '+w.url)}const dev=x.isDirect?'direct':'indirect';console.log([n,x.severity,dev,x.fixAvailable===false?'nofix':(typeof x.fixAvailable==='object'?'fix:'+x.fixAvailable.name+'@'+x.fixAvailable.version+(x.fixAvailable.isSemVerMajor?'(major)':''):'fix')].join(' | '))}})" | tee -a /tmp/ci.log
      # Saves the check output to the ci-logs branch so it can be read without downloading logs.
      - name: Save results to the ci-logs branch
        if: always() && github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          { echo "branch: ${GITHUB_REF_NAME}"; echo "commit: ${GITHUB_SHA}"; echo; cat /tmp/ci.log 2>/dev/null || echo "no log produced"; } > /tmp/ci-result.log
          git checkout -q --orphan ci-logs
          git rm -rf -q --cached . > /dev/null 2>&1 || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp /tmp/ci-result.log ./ci.log
          git add ci.log
          git commit -q -m "CI results for ${GITHUB_SHA}"
          git push -f origin ci-logs

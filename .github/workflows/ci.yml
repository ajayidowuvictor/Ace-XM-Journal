name: CI

on:
  push:
    branches-ignore: [ci-logs]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Skip until the Expo project exists
        id: gate
        run: |
          if [ -f package-lock.json ]; then echo "ready=true" >> "$GITHUB_OUTPUT"; else echo "No package-lock.json yet; skipping checks."; fi
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm
      - name: Install
        if: steps.gate.outputs.ready == 'true'
        run: npm ci 2>&1 | tee -a /tmp/ci.log
      - name: Type check
        if: steps.gate.outputs.ready == 'true'
        run: npm run typecheck 2>&1 | tee -a /tmp/ci.log
      - name: Lint
        if: steps.gate.outputs.ready == 'true'
        run: npm run lint 2>&1 | tee -a /tmp/ci.log
      - name: Format check
        if: steps.gate.outputs.ready == 'true'
        run: npm run format:check 2>&1 | tee -a /tmp/ci.log
      - name: Tests
        if: steps.gate.outputs.ready == 'true'
        run: npm test -- --ci 2>&1 | tee -a /tmp/ci.log
      - name: Bundle check (Android JavaScript bundle builds)
        if: steps.gate.outputs.ready == 'true'
        run: npx expo export --platform android 2>&1 | tee -a /tmp/ci.log
      # Reported, not blocking yet: the starter's dev tooling has known advisories that still
      # need triage (see docs/STATUS.md). Switch to blocking once triaged.
      - name: Dependency audit (report)
        if: steps.gate.outputs.ready == 'true'
        continue-on-error: true
        run: npm audit --audit-level=high 2>&1 | tee -a /tmp/ci.log
      # Saves the check output to the ci-logs branch so it can be read without downloading logs.
      - name: Save results to the ci-logs branch
        if: always() && github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          { echo "branch: ${GITHUB_REF_NAME}"; echo "commit: ${GITHUB_SHA}"; echo; cat /tmp/ci.log 2>/dev/null || echo "no log produced"; } > /tmp/ci-result.log
          git checkout -q --orphan ci-logs
          git rm -rf -q --cached . > /dev/null 2>&1 || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp /tmp/ci-result.log ./ci.log
          git add ci.log
          git commit -q -m "CI results for ${GITHUB_SHA}"
          git push -f origin ci-logs

name: APK check (diagnostic)

# Manually started. Downloads two builds from Expo, tests the files and prints their key details
# (package name, version code, minimum Android version, signing certificate) so they can be
# compared. Output is saved to the apk-logs branch. Needs the EXPO_TOKEN secret.

on:
  workflow_dispatch:
    inputs:
      new_build:
        description: 'Build id of the build that fails to install (can be left empty)'
        required: false
        default: ''
      old_build:
        description: 'Build id of a build that installed fine (can be left empty)'
        required: false
        default: ''

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      - name: List recent Android builds with their file sizes
        run: |
          set +e
          eas build:list --platform=android --limit=15 --non-interactive --json > list.json 2> list.err
          head -c 300 list.err
          node -e "
          const j=JSON.parse(require('fs').readFileSync('list.json','utf8'));
          for (const b of j) console.log([b.id,b.createdAt,b.status,b.buildProfile,(b.gitCommitHash||'').slice(0,7),b.artifacts&&b.artifacts.buildUrl||''].join(' '));
          " > list.txt
          while read ID CREATED STATUS PROFILE SHA URL; do
            SIZE=""
            [ -n "$URL" ] && SIZE=$(curl -sIL "$URL" | grep -i '^content-length' | tail -1 | tr -d '\r' | awk '{print $2}')
            echo "$ID $CREATED $STATUS $PROFILE $SHA bytes=${SIZE:-n/a}"
          done < list.txt | tee /tmp/apk-sizes.log
      - name: Inspect both builds
        env:
          NEW_BUILD: ${{ inputs.new_build }}
          OLD_BUILD: ${{ inputs.old_build }}
        run: |
          set +e
          AAPT=$(ls $ANDROID_HOME/build-tools/*/aapt2 2>/dev/null | tail -1)
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner 2>/dev/null | tail -1)
          echo "aapt2: $AAPT"; echo "apksigner: $APKSIGNER"
          for NAME in OLD NEW; do
            ID=$([ $NAME = NEW ] && echo "$NEW_BUILD" || echo "$OLD_BUILD")
            [ -z "$ID" ] && continue
            echo; echo "===== $NAME build $ID ====="
            eas build:view "$ID" --json > "$NAME.json" 2> "$NAME.err"
            echo "-- eas stderr:"; head -c 400 "$NAME.err"
            echo "-- eas json keys:"; node -e "try{const j=JSON.parse(require('fs').readFileSync('$NAME.json','utf8'));console.log(Object.keys(j).join(','));console.log(JSON.stringify(j.artifacts||{}).replace(/\\?[^\"]*/g,''))}catch(e){console.log('not json: '+require('fs').readFileSync('$NAME.json','utf8').slice(0,300))}"
            URL=$(cat "$NAME.json" | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{try{const j=JSON.parse(d);console.log(j.artifacts&&j.artifacts.buildUrl||'');}catch(e){console.log('')}})")
            echo "url: ${URL:-none}"
            [ -z "$URL" ] && continue
            curl -sSL -o "$NAME.apk" "$URL"
            ls -l "$NAME.apk"
            echo "-- zip test"; unzip -tq "$NAME.apk" | tail -2
            echo "-- manifest summary"
            "$AAPT" dump badging "$NAME.apk" 2>&1 | grep -E "^package:|sdkVersion|targetSdkVersion|native-code|application-label:" | head -8
            echo "-- signature"
            "$APKSIGNER" verify --verbose --print-certs "$NAME.apk" 2>&1 | grep -E "Verifies|Verified using|SHA-256|DOES NOT|ERROR" | head -8
            "$AAPT" dump badging "$NAME.apk" > "$NAME.badging" 2>&1
            echo "-- minSdk: $(grep -o "minSdkVersion:'[0-9]*'" $NAME.badging | head -1)"
            echo "-- permissions"; grep "^uses-permission" "$NAME.badging" | sort
            echo "-- zipalign"; ls $ANDROID_HOME/build-tools/*/zipalign | tail -1 | xargs -I{} sh -c '{} -c -P 16 4 '"$NAME"'.apk && echo "aligned 16k ok" || echo "not 16k aligned"'
            echo "-- abis in apk"
            unzip -l "$NAME.apk" | grep -oE "lib/[a-z0-9_-]+/" | sort -u
          done 2>&1 | tee /tmp/apk-check.log
          echo; echo "===== DIFF of badging (old vs new) =====" | tee -a /tmp/apk-check.log
          diff OLD.badging NEW.badging | head -60 | tee -a /tmp/apk-check.log
      - name: Save results to the apk-logs branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q --orphan apk-logs
          git rm -rf -q --cached . > /dev/null 2>&1 || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp /tmp/apk-check.log ./apk-check.log 2>/dev/null || echo "no log" > apk-check.log
          cp /tmp/apk-sizes.log ./apk-sizes.log 2>/dev/null || echo "no sizes" > apk-sizes.log
          git add apk-check.log apk-sizes.log
          git commit -q -m "APK check output"
          git push -f origin apk-logs

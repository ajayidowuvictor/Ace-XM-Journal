name: Show Expo local module template (temporary)

# Temporary helper: downloads the official local-module template that matches this project's
# Expo version and publishes its files on the "scratch-logs" branch so they can be read.

on:
  push:
    branches: [feat/today-widget]
    paths: ['.github/workflows/scaffold-module.yml']

permissions:
  contents: write

jobs:
  show:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download template
        run: |
          mkdir -p /tmp/t && cd /tmp/t
          node -e "console.log(require('/home/runner/work/Ace-XM-Journal/Ace-XM-Journal/node_modules/expo/package.json').version)" 2>/dev/null || true
          EXPO_VERSION=$(node -p "require('${GITHUB_WORKSPACE}/package.json').dependencies.expo")
          echo "expo dependency: $EXPO_VERSION"
          npm view expo-module-template-local dist-tags --json | tee tags.json
          npm view expo-module-template-local versions --json | tail -8
          TAG=$(node -p "const t=require('./tags.json'); t['sdk-57'] || t.latest")
          echo "using $TAG"
          npm pack expo-module-template-local@$TAG
          mkdir x && tar -xzf expo-module-template-local-*.tgz -C x
          find x -type f | sort
      - name: Publish template files
        run: |
          cd /tmp/t/x/package
          mkdir /tmp/out && cp -r . /tmp/out/template
          cd /tmp/out
          git init -q && git checkout -q -b scratch-logs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "template files"
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git push -f origin scratch-logs

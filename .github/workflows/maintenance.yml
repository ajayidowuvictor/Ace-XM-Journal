name: Maintenance (add dependencies, format)

# Manually started. Optionally adds packages with `npx expo install` (which picks versions
# that match the Expo SDK and updates package-lock.json), formats all files with Prettier,
# commits any changes to the branch it was started on, then starts the CI workflow there.

on:
  workflow_dispatch:
    inputs:
      packages:
        description: 'Space-separated packages to add with "npx expo install" (optional)'
        required: false
        default: ''
      relock:
        description: 'Type "true" to rebuild package-lock.json from package.json (after moving dependencies)'
        required: false
        default: ''

permissions:
  contents: write
  actions: write

jobs:
  maintain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Add packages
        if: inputs.packages != ''
        env:
          PACKAGES: ${{ inputs.packages }}
        run: npx expo install $PACKAGES
      - name: Rebuild lock file
        if: inputs.relock == 'true'
        run: npm install --package-lock-only --ignore-scripts
      - run: npx prettier --write .
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing changed"
          else
            git commit -m "chore: format and update dependencies"
            git push
          fi
      - name: Start CI on this branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref "${GITHUB_REF_NAME}"
